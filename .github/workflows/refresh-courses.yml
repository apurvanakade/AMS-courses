name: Refresh course data

on:
  schedule:
    - cron: '0 3 * * *'    # daily 03:00 UTC — adjust if a different time is preferred
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'fetch_courses.py'
      - 'build_database.py'
      - 'scripts/**'
      - '.github/workflows/refresh-courses.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh current + next term data
        run: python3 scripts/refresh_terms.py

      - name: Upload scrape error log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fetch-courses-log
          path: logs/fetch_courses.log
          if-no-files-found: ignore

      # data/*/courses.json, courses.csv, and docs/graph.json are gitignored
      # (see .gitignore) — they'd otherwise pick up a new commit every single
      # run. scripts/refresh_terms.py already force-adds a term's files the
      # one time it ages out of the current/next window, so anything staged
      # here is that one-time historical-archive commit, not daily churn.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh course data ($(date -u +%Y-%m-%d))"
            git push
          fi

      # docs/graph.json is rebuilt fresh above but never committed (see
      # .gitignore) — GitHub Pages is configured to deploy from this
      # workflow's artifact instead of from the docs/ folder in git, so the
      # live visualizer still gets today's data without it ever touching
      # git history.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
